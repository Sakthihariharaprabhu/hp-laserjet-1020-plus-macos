name: Build macOS candidate

on:
  workflow_dispatch:
  push:
    branches: [engineering-candidate]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-arm64:
    # GitHub documents macos-15 as an Apple Silicon arm64 hosted runner.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Confirm runner architecture
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Build pinned driver bundle
        run: sh build/build-bundle.sh
      - name: Validate bundle and source
        run: |
          sh scripts/test-source.sh
          sh scripts/check-bundle.sh dist/bundle
      - name: Build installer candidate
        run: sh packaging/build-release.sh
      - name: Publish candidate as workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: hp-laserjet-1020-plus-macos-arm64-candidate
          path: |
            dist/*.pkg
            dist/*.sha256
            dist/source-code/**
          if-no-files-found: error
          retention-days: 14
