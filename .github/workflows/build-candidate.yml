name: Build macOS candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-scan:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out project (full history for the secret scan)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - name: Install linters
        run: HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_ANALYTICS=1 brew install shellcheck gitleaks
      - name: Shell lint (shellcheck)
        run: shellcheck -s sh install.sh uninstall.sh packaging/postinstall packaging/build-release.sh build/build-bundle.sh src/* firmware/*.sh scripts/*.sh
      - name: Static source checks
        run: sh scripts/test-source.sh
      - name: Secret scan (working tree and full history)
        run: |
          gitleaks dir --no-banner --redact .
          gitleaks git --no-banner --redact .

  build-arm64:
    # GitHub documents macos-15 as an Apple Silicon arm64 hosted runner.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Confirm runner architecture
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Build pinned driver bundle
        run: sh build/build-bundle.sh
      - name: Validate bundle and source
        run: |
          sh scripts/test-source.sh
          sh scripts/check-bundle.sh dist/bundle
      - name: Smoke-test native print pipeline
        run: sh scripts/smoke-driver-pipeline.sh dist/bundle
      - name: Build installer candidate
        run: sh packaging/build-release.sh
      - name: Inspect package (no firmware inside, expected files present)
        run: sh scripts/check-pkg.sh dist/*-unsigned.pkg
      - name: Publish candidate as workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: hp-laserjet-1020-plus-macos-arm64-candidate
          path: |
            dist/*.pkg
            dist/*.sha256
            dist/source-code/**
          if-no-files-found: error
          retention-days: 14
